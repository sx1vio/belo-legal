      :root {
        --bg: #060607;
        --ink: #f2f4f3;
        --accent: #1db954;
        --muted: #7b8079;
        --panel: #101211;
        --font-display: "Brand", system-ui, sans-serif;
      }

      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--ink); }

      .scene { position:absolute; top:0; left:0; width:1920px; height:1080px; overflow:hidden; }
      .scene-content { width:100%; height:100%; display:flex; flex-direction:column;
        justify-content:center; align-items:center; position:relative; z-index:1; }

      /* decoratives (outside .scene-content) */
      .vignette { position:absolute; inset:0; pointer-events:none; z-index:40;
        background: radial-gradient(ellipse 62% 62% at 50% 50%, transparent 38%, rgba(0,0,0,.82) 100%); }
      .grain { position:absolute; inset:0; pointer-events:none; z-index:50; opacity:.15; mix-blend-mode:overlay;
        background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px),
                          radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.2px);
        background-size:3px 3px, 5px 5px; background-position:0 0, 1px 2px; }
      .glow { position:absolute; left:50%; top:50%; width:1100px; height:1100px; margin:-550px 0 0 -550px;
        pointer-events:none; z-index:0;
        background: radial-gradient(circle, rgba(29,185,84,.16) 0%, transparent 62%); }

      .label { font-family:var(--font-display); font-weight:500; font-size:24px;
        letter-spacing:.42em; text-transform:uppercase; color:var(--muted); }
      .display { font-family:var(--font-display); font-weight:800; line-height:.92;
        letter-spacing:-.035em; }

      /* ---- S1 pulse ---- */
      #s1-dot { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
        border-radius:50%; background:var(--accent); }
      .ring { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px;
        border-radius:50%; border:2px solid var(--accent); }
      #s1-eq { display:flex; align-items:center; justify-content:center; gap:10px; height:240px; }
      .bar { width:14px; border-radius:7px; background:var(--accent); }

      /* ---- S2 wipe reveal ---- */
      #s2-frame { position:relative; width:1180px; height:300px; }
      #s2-mask { position:absolute; left:0; top:0; height:300px; width:1180px; overflow:hidden; }
      #s2-word { font-size:280px; white-space:nowrap; line-height:300px; }
      #s2-edge { position:absolute; top:-30px; width:5px; height:360px; background:var(--accent); left:0; }

      /* ---- S3 kinetic type ---- */
      .maskline { overflow:hidden; height:220px; }
      .maskline .display { font-size:190px; line-height:220px; }
      .char { display:inline-block; }
      .green { color:var(--accent); }

      /* ---- S4 grid ---- */
      #s4-grid { display:grid; grid-template-columns:repeat(4, 300px); grid-template-rows:repeat(3, 190px);
        gap:26px; }
      .tile { background:var(--panel); border:1px solid rgba(29,185,84,.26); border-radius:18px;
        display:flex; align-items:center; justify-content:center; }
      .tile svg { width:112px; height:97px; }

      /* ---- S5 green flood ---- */
      #s5-circle { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px;
        border-radius:50%; background:var(--accent); }
      #s5-line { position:relative; z-index:2; color:#05140a; font-size:170px; }

      /* ---- S6 resolve ---- */
      #s6-word { font-size:210px; }
      #s6-rule { margin-top:38px; }
    </style>
  </head>

          <div class="tile" id="tile8">
            <svg viewBox="0 0 60 52" fill="none" stroke="var(--accent)" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M10 26 L50 26 M18 18 L18 34 M30 12 L30 40 M42 20 L42 32"/></svg>
          </div>
          <div class="tile" id="tile9">
            <svg viewBox="0 0 60 52" fill="none" stroke="var(--accent)" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M30 10 A 16 16 0 1 1 29.9 10"/><path d="M30 18 A 8 8 0 1 1 29.9 18"/></svg>
          </div>
          <div class="tile" id="tile10">
            <svg viewBox="0 0 60 52" fill="none" stroke="var(--accent)" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M10 34 C 20 34 20 18 30 18 C 40 18 40 34 50 34"/></svg>
          </div>
          <div class="tile" id="tile11">
            <svg viewBox="0 0 60 52" fill="none" stroke="var(--accent)" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="14" width="16" height="24" rx="4"/><rect x="32" y="20" width="16" height="18" rx="4"/></svg>
          </div>
          </div>
          <p class="label" id="s4-cap" style="margin-top:56px;">100 millions de titres</p>
        </div>
        <div class="vignette"></div>
        <div class="grain"></div>
      </div>

      <!-- ================= SCENE 5 : 10.6 - 12.8  (green flood) — SHADER ANCHOR 1 ====== -->
      <div class="scene clip" id="s5" data-start="10.6" data-duration="2.2" data-track-index="0"
           style="opacity:0;">
        <div id="s5-circle"></div>
        <div class="scene-content">
          <h2 class="display" id="s5-line">Sans limites.</h2>
        </div>
      </div>

      <!-- ================= SCENE 6 : 12.8 - 15.0  (resolve) — SHADER ANCHOR 2 ========== -->
      <div class="scene clip" id="s6" data-start="12.8" data-duration="2.2" data-track-index="0"
           style="opacity:0;">
        <div class="scene-content">
          <h1 class="display" id="s6-word"><span class="char ">S</span><span class="char ">p</span><span class="char ">o</span><span class="char ">t</span><span class="char ">i</span><span class="char ">f</span><span class="char ">y</span></h1>
          <svg id="s6-rule" width="620" height="6" viewBox="0 0 620 6" fill="none">
            <path id="s6-path" d="M310 3 L4 3 M310 3 L616 3" stroke="var(--accent)"
                  stroke-width="4" stroke-linecap="round"
                  stroke-dasharray="310" stroke-dashoffset="310"/>
          </svg>
        </div>
        <div class="vignette"></div>
        <div class="grain"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- scene visibility (non-anchor = autoAlpha, first anchor = opacity) ---------- */
      tl.set("#s1", { autoAlpha: 0 }, 2.6);
      tl.set("#s2", { autoAlpha: 1 }, 2.6); tl.set("#s2", { autoAlpha: 0 }, 5.0);
      tl.set("#s3", { autoAlpha: 1 }, 5.0); tl.set("#s3", { autoAlpha: 0 }, 7.6);
      tl.set("#s4", { autoAlpha: 1 }, 7.6); tl.set("#s4", { autoAlpha: 0 }, 10.6);
      tl.set("#s5", { opacity: 1 }, 10.6);
      /* s6 opacity is owned by HyperShader */

      /* =================== SCENE 1 (0 - 2.6) =================== */
      var BASE = [0.3, 0.52, 0.38, 0.74, 0.46, 0.88, 0.6, 0.42, 0.96, 0.55, 0.34, 0.68, 0.8, 0.44, 0.62, 0.92, 0.36, 0.7, 0.5, 0.84, 0.4, 0.66, 0.48, 0.32];
      var PEAK = [0.72, 0.3, 0.86, 0.42, 0.94, 0.5, 0.36, 0.9, 0.44, 0.82, 0.76, 0.34, 0.48, 0.88, 0.32, 0.54, 0.8, 0.4, 0.92, 0.46, 0.74, 0.38, 0.84, 0.68];

      tl.from("#s1-dot", { scale: 0, autoAlpha: 0, duration: .5, ease: "back.out(2.2)" }, .12);
      tl.from("#s1-glow", { autoAlpha: 0, scale: .5, duration: .9, ease: "power2.out" }, .1);

      ["#s1-r1", "#s1-r2", "#s1-r3"].forEach(function (sel, i) {
        tl.fromTo(sel, { scale: .25, autoAlpha: .95 },
          { scale: 13, autoAlpha: 0, duration: 1.05, ease: "power2.out" }, .38 + i * .2);
      });

      /* dot stretches into a line, then hands off to the bars */
      tl.to("#s1-dot", { scaleX: 24, duration: .42, ease: "power3.inOut" }, 1.18);
      tl.to("#s1-dot", { autoAlpha: 0, duration: .22, ease: "power1.out" }, 1.58);

      tl.from(".bar", { scaleY: 0, autoAlpha: 0, transformOrigin: "center",
        duration: .38, ease: "power3.out", stagger: { each: .018, from: "center" } }, 1.52);

      /* mid-scene activity: every bar keeps reacting (deterministic, fixed targets) */
      for (var i = 0; i < 24; i++) {
        tl.to("#bar" + i, { scaleY: PEAK[i] / BASE[i], transformOrigin: "center",
          duration: .29, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.90 + (i % 6) * .02);
      }

      /* =================== SCENE 2 (2.6 - 5.0) =================== */
      tl.from("#s2-kicker", { autoAlpha: 0, y: 18, duration: .5, ease: "power2.out" }, 2.72);
      tl.fromTo("#s2-mask", { width: 0 }, { width: 1180, duration: .78, ease: "power3.inOut" }, 2.86);
      tl.fromTo("#s2-edge", { left: 0, autoAlpha: 1 },
        { left: 1180, duration: .78, ease: "power3.inOut" }, 2.86);
      tl.to("#s2-edge", { autoAlpha: 0, duration: .2, ease: "power1.out" }, 3.62);
      /* mid-scene: slow push + tracking release */
      tl.fromTo("#s2-word", { letterSpacing: "-.055em" },
        { letterSpacing: "-.02em", duration: 1.5, ease: "sine.inOut" }, 3.4);
      tl.to("#s2-kicker", { y: -8, duration: .8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.3);

      /* =================== SCENE 3 (5.0 - 7.6) =================== */
      tl.from("#s3-l1 .char", { yPercent: 118, autoAlpha: 0, duration: .58,
        ease: "power4.out", stagger: { each: .045, from: "start" } }, 5.12);
      tl.from("#s3-l2 .char", { yPercent: 118, autoAlpha: 0, duration: .58,
        ease: "expo.out", stagger: { each: .045, from: "start" } }, 5.55);
      /* mid-scene: breathing scale on the green line + slow counter-drift on the white one */
      tl.to("#s3-l2", { scale: 1.035, duration: .62, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.3);
      tl.to("#s3-l1", { x: -14, duration: .7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.2);

      /* =================== SCENE 4 (7.6 - 10.6) =================== */
      tl.from(".tile", { scale: .58, autoAlpha: 0, duration: .5, ease: "back.out(1.5)",
        stagger: { each: .045, from: "center" } }, 7.72);
      tl.from(".tile svg", { autoAlpha: 0, duration: .4, ease: "power2.out",
        stagger: { each: .035, from: "center" } }, 8.05);
      tl.from("#s4-cap", { autoAlpha: 0, y: 20, duration: .5, ease: "power2.out" }, 8.55);
      /* mid-scene: whole grid drifts, individual tiles pulse off-phase */
      tl.to("#s4-grid", { rotate: 1.4, y: -16, duration: 1.0, ease: "sine.inOut",
        yoyo: true, repeat: 1 }, 8.5);
      for (var t = 0; t < 12; t++) {
        tl.to("#tile" + t, { scale: 1.055, duration: .44, ease: "sine.inOut", yoyo: true, repeat: 1 },
          8.7 + (t % 5) * .13);
      }

      /* =================== SCENE 5 (10.6 - 12.8) — anchor, no exit tweens ============ */
      tl.fromTo("#s5-circle", { scale: .2, autoAlpha: 1 },
        { scale: 46, duration: .95, ease: "power3.inOut" }, 10.68);
      tl.from("#s5-line", { autoAlpha: 0, yPercent: 40, duration: .6, ease: "power4.out" }, 11.5);
      tl.to("#s5-line", { scale: 1.03, duration: .4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.9);

      /* =================== SCENE 6 (12.8 - 15.0) — anchor, resolve ================== */
      tl.from("#s6-word .char", { yPercent: 110, autoAlpha: 0, duration: .62,
        ease: "expo.out", stagger: { each: .05, from: "start" } }, 12.92);
      tl.to("#s6-path", { strokeDashoffset: 0, duration: .9, ease: "power2.inOut" }, 13.5);
      tl.to("#s6-word", { y: -6, duration: .7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 13.6);

      /* ---------- one contiguous shader chain: s5 -> s6 ---------- */
      window.HyperShader.init({
        bgColor: "#060607",
        scenes: ["s5", "s6"],
        timeline: tl,
        transitions: [{ time: 12.55, shader: "sdf-iris", duration: .5 }]
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
